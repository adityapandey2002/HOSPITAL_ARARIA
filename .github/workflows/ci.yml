name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch makes the previous run obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Both ORMs read DATABASE_URL, and some modules validate it at import time.
  # CI never connects: schema:check, tsc, Jest and next build all run offline.
  DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
  JWT_SECRET: ci-only-secret-that-is-at-least-32-characters
  NODE_ENV: test

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Enforce Drizzle/MikroORM table ownership
        run: npm run schema:check

      - name: Type-check shared package
        run: npm run build --workspace=packages/shared

      - name: Build backend
        run: npm run build:backend

      - name: Build frontend
        run: npm run build:frontend

      - name: Run tests
        run: npm test

      - name: Audit production dependencies
        run: npm run audit:ci
